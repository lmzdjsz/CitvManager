<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B7 城市管理数字化平台</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/echarts@5/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:#f4f6f9;color:#2d3a5c;font-size:14px}
.topbar{height:56px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 1px 4px rgba(0,0,0,.06);position:relative;z-index:10}
.logo{font-size:18px;font-weight:700;color:#2d3a5c;display:flex;align-items:center;gap:10px}
.logo .badge{background:#ff5b5b;color:#fff;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.logo .sub{font-size:12px;color:#9aa5b1;font-weight:400;margin-left:6px}
.topbar .right{display:flex;gap:18px;font-size:12px;color:#6b7785;align-items:center}
.topbar .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#36c46b;margin-right:5px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.layout{display:flex;min-height:calc(100vh - 56px)}
.sidebar{width:220px;background:#2d3a5c;color:#cfd8e3;flex-shrink:0;padding:16px 0}
.menu-group{font-size:11px;color:#7a8aa3;padding:14px 20px 6px;letter-spacing:1px}
.menu-item{padding:10px 20px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:.2s;font-size:13px}
.menu-item:hover{background:#3a4a6b;color:#fff}
.menu-item.active{background:#ff5b5b;color:#fff}
.menu-item .ico{font-size:15px;width:20px;text-align:center}
.main{flex:1;padding:20px 24px;overflow-x:auto}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:16px;overflow:hidden}
.card-h{padding:14px 18px;border-bottom:1px solid #f0f3f7;display:flex;justify-content:space-between;align-items:center}
.card-h .t{font-size:14px;font-weight:600;color:#2d3a5c}
.card-h .sm{font-size:11px;color:#9aa5b1;font-weight:400;margin-left:6px}
.card-b{padding:16px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.chart{height:280px}
.chart.s{height:240px}
.er{height:420px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f7f9fc;color:#6b7785;font-weight:600;padding:10px 12px;text-align:left;font-size:12px;position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid #f0f3f7;color:#2d3a5c}
tr:hover td{background:#fafbfc}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi .b{background:#fff;border-radius:10px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.05);border-left:4px solid #ff5b5b}
.kpi .b:nth-child(2){border-left-color:#4a8cff}
.kpi .b:nth-child(3){border-left-color:#ff9f43}
.kpi .b:nth-child(4){border-left-color:#36c46b}
.kpi .lab{font-size:12px;color:#9aa5b1;margin-bottom:6px}
.kpi .val{font-size:26px;font-weight:700;color:#2d3a5c}
.kpi .sub{font-size:11px;color:#9aa5b1;margin-top:4px}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600}
.s-ok{background:#e6f9ee;color:#36c46b}
.s-run{background:#fff3e0;color:#ff9f43}
.s-wait{background:#eef2ff;color:#4a8cff}
.s-bad{background:#fde8e8;color:#ff5b5b}
.btn{padding:7px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;transition:.2s}
.btn-pri{background:#ff5b5b;color:#fff}
.btn-pri:hover{background:#e04848}
.btn-sec{background:#f0f3f7;color:#6b7785}
.btn-sec:hover{background:#e4e9f0}
.btn-sm{padding:4px 10px;font-size:12px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar label{font-size:12px;color:#6b7785}
.toolbar select,.toolbar input{padding:6px 10px;border:1px solid #e0e6ed;border-radius:6px;font-size:13px;background:#fff;color:#2d3a5c}
.empty{text-align:center;padding:40px;color:#9aa5b1;font-size:13px}
.loading{text-align:center;padding:40px;color:#9aa5b1}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border-radius:10px;width:480px;max-width:90vw;max-height:90vh;overflow:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal-h{padding:16px 20px;border-bottom:1px solid #f0f3f7;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.modal-h .x{cursor:pointer;color:#9aa5b1;font-size:18px}
.modal-b{padding:20px}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:12px;color:#6b7785;margin-bottom:5px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:8px 10px;border:1px solid #e0e6ed;border-radius:6px;font-size:13px;color:#2d3a5c}
.form-row textarea{resize:vertical;min-height:60px}
.modal-f{padding:14px 20px;border-top:1px solid #f0f3f7;display:flex;justify-content:flex-end;gap:10px}
.toast{position:fixed;top:70px;right:24px;padding:12px 20px;border-radius:8px;color:#fff;font-size:13px;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.15);animation:slideIn .3s}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.toast.ok{background:#36c46b}
.toast.err{background:#ff5b5b}
.mod{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05);text-align:center}
.mod .ic{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 12px;color:#fff}
.mod h3{font-size:14px;margin-bottom:6px;color:#2d3a5c}
.mod p{font-size:12px;color:#9aa5b1;line-height:1.6}
.mod .num{margin-top:10px;font-size:11px;color:#ff5b5b;font-weight:700}
.tbl-info{font-size:12px;color:#9aa5b1;padding:8px 18px;background:#fafbfc;border-bottom:1px solid #f0f3f7}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="logo"><div class="badge">B7</div> 城市管理数字化平台 <span class="sub">CMPD · City Management Platform</span></div>
    <div class="right">
      <span><span class="dot"></span>MySQL CMPD 已连接</span>
      <span>127.0.0.1:5000</span>
      <span>{{ now }}</span>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="menu-group">主面板</div>
      <div class="menu-item" :class="{active:tab==='overview'}" @click="go('overview')"><span class="ico">📊</span> 平台概览</div>
      <div class="menu-item" :class="{active:tab==='model'}" @click="go('model')"><span class="ico">🗄️</span> 数据模型</div>
      <div class="menu-group">业务模块</div>
      <div class="menu-item" :class="{active:tab==='infra'}" @click="go('infra')"><span class="ico">🛣️</span> 基础设施管理</div>
      <div class="menu-item" :class="{active:tab==='event'}" @click="go('event')"><span class="ico">📣</span> 事件报告处理</div>
      <div class="menu-item" :class="{active:tab==='dispatch'}" @click="go('dispatch')"><span class="ico">🚚</span> 资源调度</div>
      <div class="menu-item" :class="{active:tab==='env'}" @click="go('env')"><span class="ico">🌿</span> 环境监测</div>
      <div class="menu-group">基础数据管理</div>
      <div class="menu-item" :class="{active:tab==='m_citizen'}" @click="go('m_citizen')"><span class="ico">👤</span> 市民管理</div>
      <div class="menu-item" :class="{active:tab==='m_dept'}" @click="go('m_dept')"><span class="ico">🏢</span> 部门管理</div>
      <div class="menu-item" :class="{active:tab==='m_worker'}" @click="go('m_worker')"><span class="ico">👷</span> 维修人员管理</div>
      <div class="menu-item" :class="{active:tab==='m_trt'}" @click="go('m_trt')"><span class="ico">🚒</span> 维修资源管理</div>
      <div class="menu-item" :class="{active:tab==='m_device'}" @click="go('m_device')"><span class="ico">📡</span> 监测设备管理</div>
      <div class="menu-group">期末上机查询</div>
      <div class="menu-item" :class="{active:tab==='q1'}" @click="go('q1')"><span class="ico">①</span> 查询1·区域内设施</div>
      <div class="menu-item" :class="{active:tab==='q2'}" @click="go('q2')"><span class="ico">②</span> 查询2·事件处理情况</div>
      <div class="menu-item" :class="{active:tab==='q3'}" @click="go('q3')"><span class="ico">③</span> 查询3·维修人员统计</div>
      <div class="menu-item" :class="{active:tab==='q4'}" @click="go('q4')"><span class="ico">④</span> 查询4·区域综合分析</div>
    </div>

    <div class="main">
      <!-- 概览 -->
      <template v-if="tab==='overview'">
        <div class="kpi">
          <div class="b"><div class="lab">基础设施总数</div><div class="val">{{ ov.infra_total }}</div><div class="sub">在用 {{ ov.infra_ok }} · 报修 {{ ov.infra_bad }}</div></div>
          <div class="b"><div class="lab">事件报告总数</div><div class="val">{{ ov.ev_total }}</div><div class="sub">完成率 {{ ov.ev_rate }}%</div></div>
          <div class="b"><div class="lab">维修人员</div><div class="val">{{ ov.wk_total }}</div><div class="sub">在岗 {{ ov.wk_busy }} · 空闲 {{ ov.wk_idle }}</div></div>
          <div class="b"><div class="lab">监测设备</div><div class="val">{{ ov.dev_total }}</div><div class="sub">在线 {{ ov.dev_online }} · 离线 {{ ov.dev_offline }}</div></div>
        </div>
        <div class="grid2">
          <div class="card"><div class="card-h"><div class="t">事件报告趋势 <span class="sm">ERT · 按日</span></div></div><div class="card-b"><div id="c_trend" class="chart"></div></div></div>
          <div class="card"><div class="card-h"><div class="t">事件类型分布 <span class="sm">ERT.event_type</span></div></div><div class="card-b"><div id="c_type" class="chart"></div></div></div>
        </div>
        <div class="grid3">
          <div class="mod"><div class="ic" style="background:#ff5b5b">🛣️</div><h3>市政基础设施管理</h3><p>道路、桥梁、照明、垃圾桶等设施的统一数字化登记，含唯一标识、GPS 位置、安装日期与维修记录。</p><div class="num">IT</div></div>
          <div class="mod"><div class="ic" style="background:#4a8cff">📣</div><h3>事件报告与处理</h3><p>市民上报道路损坏、设施故障、垃圾堆积等事件，指派部门处理并跟踪进度、人员与结果。</p><div class="num">ERT</div></div>
          <div class="mod"><div class="ic" style="background:#ff9f43">🚚</div><h3>资源分配与调度</h3><p>维修人员、车辆、工具的可用状态管理与任务派单，记录任务起止时间与执行情况。</p><div class="num">TST</div></div>
          <div class="mod"><div class="ic" style="background:#36c46b">🌿</div><h3>环境监测</h3><p>各区域 AQI、噪音、温湿度、PM2.5 实时采集，监测设备在线状态与历史趋势分析。</p><div class="num">EDT</div></div>
          <div class="mod"><div class="ic" style="background:#9b6dff">📈</div><h3>数据分析与决策</h3><p>按区域/时段统计事件数量、维修频率、资源使用效率，为管理部门决策提供数据支撑。</p><div class="num">ST</div></div>
          <div class="mod"><div class="ic" style="background:#2d3a5c">🔍</div><h3>综合查询</h3><p>支持设施维修记录、事件处理进度、资源使用情况、环境趋势等多维查询需求。</p><div class="num">Q</div></div>
        </div>
      </template>

      <!-- 数据模型 -->
      <template v-if="tab==='model'">
        <div class="card">
          <div class="card-h"><div class="t">12 张数据表结构 <span class="sm">点击表名查看字段</span></div></div>
          <div class="card-b" style="padding:0">
            <table>
              <tr><th>表代码</th><th>表名</th><th>字段数</th><th>主键</th><th>外键</th></tr>
              <tr v-for="t in tables" :key="t.code" style="cursor:pointer" @click="selTable=t.code">
                <td style="color:#ff5b5b;font-weight:700">{{ t.code }}</td>
                <td>{{ t.name }}</td>
                <td>{{ t.fields.length }}</td>
                <td>{{ t.fields.filter(f=>f.pk).map(f=>f.n).join(',') }}</td>
                <td>{{ t.fields.filter(f=>f.fk).map(f=>f.n).join(',') }}</td>
              </tr>
            </table>
          </div>
        </div>
        <div class="card">
          <div class="card-h"><div class="t">{{ selTable }} 表字段明细</div></div>
          <div class="card-b" style="padding:0">
            <table>
              <tr><th>字段名</th><th>类型</th><th>主键</th><th>外键</th></tr>
              <tr v-for="f in (tables.find(t=>t.code===selTable)||tables[0]).fields" :key="f.n">
                <td style="font-weight:600">{{ f.n }}</td><td>{{ f.t }}</td>
                <td>{{ f.pk?'✓':'' }}</td><td>{{ f.fk?'✓':'' }}</td>
              </tr>
            </table>
          </div>
        </div>
        <div class="card"><div class="card-h"><div class="t">实体关系图（ER Diagram）</div></div><div class="card-b"><div id="c_er" class="er"></div></div></div>
      </template>

      <!-- 基础设施管理 -->
      <template v-if="tab==='infra'">
        <div class="toolbar">
          <label>区域</label><select v-model="infraFilter.region" @change="loadInfra"><option value="">全部</option><option v-for="r in regionList" :key="r.region_name" :value="r.region_name">{{ r.region_name }}</option></select>
          <label>类型</label><select v-model="infraFilter.type" @change="loadInfra"><option value="">全部</option><option v-for="t in infraTypes" :key="t" :value="t">{{ t }}</option></select>
          <button class="btn btn-pri" @click="openModal('infra')">+ 新增设施</button>
        </div>
        <div class="grid2">
          <div class="card"><div class="card-h"><div class="t">设施类型分布</div></div><div class="card-b"><div id="c_itype" class="chart s"></div></div></div>
          <div class="card"><div class="card-h"><div class="t">各区域设施数量</div></div><div class="card-b"><div id="c_ireg" class="chart s"></div></div></div>
        </div>
        <div class="card">
          <div class="card-h"><div class="t">设施清单 <span class="sm">IT ⋈ RT · 共 {{ infraRows.length }} 条</span></div></div>
          <div class="card-b" style="padding:0;max-height:420px;overflow:auto">
            <table v-if="infraRows.length">
              <tr><th>编号</th><th>名称</th><th>类型</th><th>区域</th><th>安装日期</th><th>状态</th><th>操作</th></tr>
              <tr v-for="r in infraRows" :key="r.infra_id"><td>{{ r.infra_id }}</td><td>{{ r.infra_name }}</td><td>{{ r.infra_type }}</td><td>{{ r.region_name }}</td><td>{{ r.install_time }}</td><td><span class="tag" :class="infraSc(r.status)">{{ r.status_name }}</span></td><td><button class="btn btn-sec btn-sm" @click="editInfra(r)">编辑</button> <button class="btn btn-sec btn-sm" @click="delInfra(r.infra_id)">删除</button></td></tr>
            </table>
            <div v-else class="empty">暂无数据</div>
          </div>
        </div>
      </template>

      <!-- 事件报告处理 -->
      <template v-if="tab==='event'">
        <div class="toolbar">
          <button class="btn btn-pri" @click="openModal('event')">+ 新增事件上报</button>
        </div>
        <div class="grid2">
          <div class="card"><div class="card-h"><div class="t">事件来源类型占比</div></div><div class="card-b"><div id="c_etype" class="chart s"></div></div></div>
          <div class="card"><div class="card-h"><div class="t">各区域事件报告数</div></div><div class="card-b"><div id="c_ereg" class="chart s"></div></div></div>
        </div>
        <div class="card">
          <div class="card-h"><div class="t">事件报告 <span class="sm">ERT ⋈ CT ⋈ RT · 共 {{ eventRows.length }} 条</span></div></div>
          <div class="card-b" style="padding:0;max-height:420px;overflow:auto">
            <table v-if="eventRows.length">
              <tr><th>编号</th><th>标题</th><th>类型</th><th>区域</th><th>报告人</th><th>报告时间</th><th>状态</th><th>操作</th></tr>
              <tr v-for="r in eventRows" :key="r.event_id"><td>{{ r.event_id }}</td><td>{{ r.event_title }}</td><td>{{ r.event_type }}</td><td>{{ r.region }}</td><td>{{ r.citizen }}</td><td>{{ r.report_time }}</td><td><span class="tag" :class="evSc(r.event_status)">{{ r.status_name }}</span></td><td><button class="btn btn-sec btn-sm" @click="editEvent(r)">编辑</button> <button class="btn btn-sec btn-sm" @click="delEvent(r.event_id)">删除</button></td></tr>
            </table>
            <div v-else class="empty">暂无数据</div>
          </div>
        </div>
      </template>

      <!-- 资源调度 -->
      <template v-if="tab==='dispatch'">
        <div class="toolbar">
          <button class="btn btn-pri" @click="openModal('task')">+ 新增派单</button>
        </div>
        <div class="grid2">
          <div class="card"><div class="card-h"><div class="t">资源类型构成 (TRT)</div></div><div class="card-b"><div id="c_rtype" class="chart s"></div></div></div>
          <div class="card"><div class="card-h"><div class="t">任务状态分布 (TST)</div></div><div class="card-b"><div id="c_tstat" class="chart s"></div></div></div>
        </div>
        <div class="card">
          <div class="card-h"><div class="t">派单任务 <span class="sm">TST ⋈ ERT ⋈ WT ⋈ DT · 共 {{ taskRows.length }} 条</span></div></div>
          <div class="card-b" style="padding:0;max-height:420px;overflow:auto">
            <table v-if="taskRows.length">
              <tr><th>任务ID</th><th>事件</th><th>处理人</th><th>部门</th><th>资源</th><th>开始</th><th>结束</th><th>状态</th><th>操作</th></tr>
              <tr v-for="r in taskRows" :key="r.task_id"><td>{{ r.task_id }}</td><td>{{ r.event_title }}</td><td>{{ r.worker }}</td><td>{{ r.dept }}</td><td>{{ r.resource||'—' }}</td><td>{{ r.task_start||'—' }}</td><td>{{ r.task_end||'—' }}</td><td><span class="tag" :class="taskSc(r.task_status)">{{ r.status_name }}</span></td><td><button v-if="r.task_status!==3" class="btn btn-pri btn-sm" @click="finishTask(r.task_id)">完成</button></td></tr>
            </table>
            <div v-else class="empty">暂无数据</div>
          </div>
        </div>
      </template>

      <!-- 环境监测 -->
      <template v-if="tab==='env'">
        <div class="grid2">
          <div class="card"><div class="card-h"><div class="t">PM2.5 / PM10 趋势</div></div><div class="card-b"><div id="c_pm" class="chart"></div></div></div>
          <div class="card"><div class="card-h"><div class="t">噪音 / 温湿度趋势</div></div><div class="card-b"><div id="c_noise" class="chart"></div></div></div>
        </div>
        <div class="card">
          <div class="card-h"><div class="t">监测设备清单 <span class="sm">MDT ⋈ RT · 共 {{ devRows.length }} 条</span></div></div>
          <div class="card-b" style="padding:0">
            <table v-if="devRows.length">
              <tr><th>设备ID</th><th>设备名称</th><th>编号</th><th>类型</th><th>区域</th><th>安装位置</th><th>安装时间</th><th>状态</th></tr>
              <tr v-for="r in devRows" :key="r.device_id"><td>{{ r.device_id }}</td><td>{{ r.device_name }}</td><td>{{ r.device_no }}</td><td>{{ r.device_type }}</td><td>{{ r.region_name }}</td><td>{{ r.install_loc }}</td><td>{{ r.install_time }}</td><td><span class="tag" :class="r.online_status===1?'s-ok':'s-bad'">{{ r.status_name }}</span></td></tr>
            </table>
            <div v-else class="empty">暂无数据</div>
          </div>
        </div>
      </template>

      <!-- 查询1 -->
      <template v-if="tab==='q1'">
        <div class="card">

async function api(url, opts){
  opts = opts || {};
  opts.cache = 'no-store';
  const r = await fetch(url, opts);
  if(!r.ok) throw new Error('API '+r.status);
  return r.json();
}
function pad(n){return n<10?'0'+n:''+n;}
function dtStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}

          a.setOption({tooltip:{trigger:'axis'},legend:{top:0},grid:{left:45,right:20,top:30,bottom:30},xAxis:{type:'category',data:names,axisLine:{lineStyle:{color:'#dfe4ea'}}},yAxis:{type:'value',splitLine:{lineStyle:{color:'#f0f3f7'}}},series:[{name:'任务数',type:'bar',data:q3.result.map(r=>r.total),itemStyle:{color:'#ff5b5b',borderRadius:[4,4,0,0]}},{name:'已完成',type:'bar',data:q3.result.map(r=>r.done),itemStyle:{color:'#36c46b',borderRadius:[4,4,0,0]}}]});
          const b=echarts.init(document.getElementById('c_q3b'));
          b.setOption({tooltip:{trigger:'axis'},grid:{left:45,right:20,top:20,bottom:30},xAxis:{type:'category',data:names,axisLine:{lineStyle:{color:'#dfe4ea'}}},yAxis:{type:'value',splitLine:{lineStyle:{color:'#f0f3f7'}}},series:[{type:'bar',data:q3.result.map(r=>r.avg_min||0),itemStyle:{color:'#4a8cff',borderRadius:[4,4,0,0]}}]});
        });
      }catch(e){showToast('统计失败：'+e.message,false);}finally{q3.loading=false;}
    }
    async function runQ4(){
      q4.loading=true;
      try{
        const d=await api(`/api/q4?start=${q4.s}&end=${q4.e}`);
        q4.stat=d.stat;q4.env=d.env;
        nextTick(()=>{
          const days=[...new Set(d.env.map(x=>x.d))];
          const regs=[...new Set(d.env.map(x=>x.region))];
          const pm=echarts.init(document.getElementById('c_q4pm'));
          pm.setOption({tooltip:{trigger:'axis'},legend:{top:0},grid:{left:45,right:20,top:30,bottom:30},xAxis:{type:'category',data:days},yAxis:{type:'value'},series:regs.map((r,i)=>({name:r,type:'line',smooth:true,data:days.map(dd=>{const x=d.env.find(e=>e.region===r&&e.d===dd);return x?x.pm25:null;}),itemStyle:{color:COLORS[i%COLORS.length]}}))});
          const n=echarts.init(document.getElementById('c_q4n'));
          n.setOption({tooltip:{trigger:'axis'},legend:{top:0},grid:{left:45,right:20,top:30,bottom:30},xAxis:{type:'category',data:days},yAxis:{type:'value'},series:regs.map((r,i)=>({name:r,type:'line',smooth:true,data:days.map(dd=>{const x=d.env.find(e=>e.region===r&&e.d===dd);return x?x.noise:null;}),itemStyle:{color:COLORS[i%COLORS.length]}}))});
        });
      }catch(e){showToast('分析失败：'+e.message,false);}finally{q4.loading=false;}
    }

    function go(t){
      tab.value=t;
      if(t==='overview')loadOverview();
      if(t==='model')renderModel();
      if(t==='infra')loadInfra();
      if(t==='event')loadEvent();
      if(t==='dispatch')loadDispatch();
      if(t==='env')loadEnv();
      if(t==='q1'&&!q1.result.length)runQ1();
      if(t==='q2'&&!q2.result.length)runQ2();
      if(t==='q3'&&!q3.result.length)runQ3();
      if(t==='q4'&&!q4.stat.length)runQ4();
      if(t==='m_citizen')loadCitizens();
      if(t==='m_dept')loadDepts();
      if(t==='m_worker')loadWorkers();
      if(t==='m_trt')loadTrt();
      if(t==='m_device')loadDevices();
    }

    onMounted(async()=>{
      try{
        regionList.value=await api('/api/regions');
        workerList.value=await api('/api/workers');
        resourceList.value=await api('/api/resources');
        deptList.value=await api('/api/depts');
        infraTypes.value=await api('/api/infra-types');
        eventTypes.value=await api('/api/event-types');
        if(regionList.value.length)q1.region=regionList.value[0].region_name;
      }catch(e){showToast('后端连接失败，请确认 Flask 已启动',false);}
      loadOverview();
    });

    return {tab,now,tables,selTable,toast,ov,infraRows,eventRows,taskRows,devRows,regionList,workerList,resourceList,deptList,infraTypes,eventTypes,infraFilter,infraSc,evSc,taskSc,q1,runQ1,q2,runQ2,q3,runQ3,q4,runQ4,go,modal,form,openModal,submitForm,delInfra,delEvent,finishTask,editInfra,editEvent,editRow,delRow,citizenRows,deptRows,workerRows,trtRows,deviceRows};
  }
}).mount('#app');
</script>
